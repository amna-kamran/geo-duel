<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Geo Duel</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <img src="o.geo.svg" alt="Geo Duel" class="logo" />
      <div id="status" class="status-pill">Connecting...</div>
    </header>

    <div class="panel info-panel">
      <div id="place"></div>
      <div id="continent" class="hint continent-reveal"></div>
      <div id="opponent" class="hint"></div>
      <div class="hint">Drag to rotate &middot; Scroll to zoom in on terrain &middot; Click to drop your pin</div>
      <div id="scores">
        <span class="score-chip score-you">
          <span class="score-label">You</span>
          <strong id="yourTotal">0</strong>
        </span>
        <span class="score-chip score-opponent">
          <span class="score-label">Opponent</span>
          <strong id="oppTotal">0</strong>
        </span>
      </div>
    </div>

    <div id="map" class="map-panel"></div>

    <div class="panel controls-panel">
      <div id="controls">
        <button id="submitBtn" disabled>Submit Guess</button>
        <button id="nextBtn" class="secondary" style="display:none">Ready for Next Round</button>
      </div>
      <div id="result"></div>
    </div>

    <div class="panel leaderboard-panel">
      <div class="leaderboard-header">
        <h2>Leaderboard</h2>
        <span class="hint">By total score</span>
      </div>
      <ol id="leaderboardList" class="leaderboard-list"></ol>
    </div>
  </div>

  <div id="nameModal" class="modal-overlay">
    <div class="modal panel">
      <img src="o.geo.svg" alt="Geo Duel" class="logo modal-logo" />
      <p class="modal-copy">Pick a name for the leaderboard</p>
      <form id="nameForm">
        <input id="nameInput" type="text" maxlength="24" placeholder="Your name" autocomplete="off" />
        <button type="submit">Start Playing</button>
      </form>
    </div>
  </div>

  <script>
    (g => {
      var h, a, k, p = "The Google Maps JavaScript API", c = "google", l = "importLibrary", q = "__ib__", m = document, b = window;
      b = b[c] || (b[c] = {});
      var d = b.maps || (b.maps = {}), r = new Set, e = new URLSearchParams,
        u = () => h || (h = new Promise(async (f, n) => {
          await (a = m.createElement("script"));
          e.set("libraries", [...r] + "");
          for (k in g) e.set(k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()), g[k]);
          e.set("callback", c + ".maps." + q);
          a.src = `https://maps.${c}apis.com/maps/api/js?` + e;
          d[q] = f;
          a.onerror = () => h = n(Error(p + " could not load."));
          a.nonce = m.querySelector("script[nonce]")?.nonce || "";
          m.head.append(a);
        }));
      d[l] ? console.warn(p + " only loads once. Ignoring:", g) : d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n));
    })({ key: "AIzaSyCfrwSRd_5qNO3AvlVfotOAy2TyWwWlYJQ", v: "alpha" });
  </script>
  <script src="app.js"></script>
</body>
</html>
