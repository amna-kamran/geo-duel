<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Geo Duel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Geo Duel</h1>
  <div id="status">Connecting...</div>
  <div id="place"></div>
  <div id="scores">
    <span>You: <strong id="yourTotal">0</strong></span>
    <span>Opponent: <strong id="oppTotal">0</strong></span>
  </div>
  <div id="map"></div>
  <div id="controls">
    <button id="submitBtn" disabled>Submit Guess</button>
    <button id="nextBtn" style="display:none">Ready for Next Round</button>
  </div>
  <div id="result"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
